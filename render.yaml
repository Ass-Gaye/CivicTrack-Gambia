services:
  - type: web
    name: civictrack-api
    env: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civictrack-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DEMO_OFFICER_NAME
        sync: false
      - key: DEMO_OFFICER_EMAIL
        sync: false
      - key: DEMO_OFFICER_PASSWORD
        sync: false

databases:
  - name: civictrack-db
    plan: free
    region: oregon
